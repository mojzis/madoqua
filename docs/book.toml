[book]
title = "madoqua"
description = "TODO: one-line description of madoqua"
authors = ["mojzis"]
language = "en"
src = "src"

[build]
build-dir = "book/html"

[output.html]
site-url = "/madoqua/"
git-repository-url = "https://github.com/mojzis/madoqua"
edit-url-template = "https://github.com/mojzis/madoqua/edit/main/docs/{path}"
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js", "version.js"]

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
